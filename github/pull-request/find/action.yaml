name: 'Find GitHub pull request'

description: 'Action to find a GitHub pull request'

inputs:
  branch:
    description: 'Branch name'
    required: true
    type: string

outputs:
  number:
    description: "Pull request number"
    value: ${{ steps.find-pull-request.outputs.number }}

runs:
  using: "composite"

  steps:
    - name: ⤴️ Find GitHub pull request
      id: find-pull-request
      uses: juliangruber/find-pull-request-action@0d2ca757412e2742b5cd5ce4ff56757c65652605 # v1.12.0
      with:
        branch: ${{ inputs.branch }}
